spring.application.name=rooms

spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.url=jdbc:h2:file:./data/rooms
spring.datasource.password=

api.security.token.secret=minha-chave-muito-secreta-e-ultra-segura-com-mais-de-32-caracteres
api.security.token.expiration-hours=8

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Campos desconhecidos no corpo da requisicao sao rejeitados com 400 em vez de ignorados
spring.jackson.deserialization.fail-on-unknown-properties=true

# spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
