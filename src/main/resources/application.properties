spring.application.name=rooms

spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.url=jdbc:h2:file:./data/rooms
spring.datasource.password=

api.security.token.secret=minha-chave-muito-secreta-e-ultra-segura-com-mais-de-32-caracteres
api.security.token.expiration-hours=8

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Campos desconhecidos no corpo da requisicao sao rejeitados com 400 em vez de ignorados
spring.jackson.deserialization.fail-on-unknown-properties=true

# spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Reprocessa no boot as publicacoes que ficaram pendentes. Sem isto (o default e false), um
# relatorio interrompido por queda da aplicacao ficaria PROCESSING para sempre
spring.modulith.events.republish-outstanding-events-on-restart=true

# Onde ficam os arquivos gerados. O banco guarda so a chave; os bytes nunca entram em coluna
report.storage.path=./data/reports

# Excel em pt-BR usa ponto e virgula como separador e precisa do BOM para nao comer os acentos.
# Se o consumidor do CSV for outro sistema, os dois atrapalham
report.csv.separator=;
report.csv.bom=true
